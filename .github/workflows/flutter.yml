name: Flutter CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test_and_build:
    name: Flutter Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test --dart-define=APP_ENV=demo

      - name: Build Android Debug APK
        run: flutter build apk --debug --dart-define=APP_ENV=demo

      # For iOS, we would need a macOS runner:
      # runs-on: macos-latest
      # - name: Build iOS
      #   run: flutter build ios --release --no-codesign
